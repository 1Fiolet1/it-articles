services:
  postgres:
    image: postgres:16
    container_name: it-articles-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - it-articles-postgres-16-data:/var/lib/postgresql/data

volumes:
  it-articles-postgres-16-data:
